name: Mirror to prumo (public)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: mirror-to-prumo
  # Espelhamento é deploy: em pushes rápidos em sequência, só o último importa.
  # Cancelar os intermediários evita race e publicar estado transitório (#159).
  cancel-in-progress: true

jobs:
  mirror:
    name: Espelhar subset distribuível
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout prumo-dev
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 1

      - name: Staging do subset distribuível
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/prumo-dist"
          mkdir -p "$STAGE"

          cp -R skills                         "$STAGE/skills"
          mkdir -p "$STAGE/runtime"
          cp -R runtime/prumo_runtime          "$STAGE/runtime/prumo_runtime"
          cp    README.md                      "$STAGE/README.md"
          cp    CHANGELOG.md                   "$STAGE/CHANGELOG.md"
          cp    VERSION                        "$STAGE/VERSION"
          cp    LICENSE                        "$STAGE/LICENSE"
          cp    pyproject.toml                 "$STAGE/pyproject.toml"
          cp    plugin.json                    "$STAGE/plugin.json"
          cp    marketplace.json               "$STAGE/marketplace.json"
          cp -R .claude-plugin                 "$STAGE/.claude-plugin"
          cp -R .codex-plugin                  "$STAGE/.codex-plugin"

          mkdir -p "$STAGE/scripts"
          cp scripts/prumo_runtime_install.sh    "$STAGE/scripts/"
          cp scripts/prumo_runtime_update.sh     "$STAGE/scripts/"
          cp scripts/prumo_runtime_install.ps1   "$STAGE/scripts/"
          cp scripts/prumo_runtime_update.ps1    "$STAGE/scripts/"
          cp scripts/prumo_antigravity_install.sh "$STAGE/scripts/"

          # Higiene: remover caches se sobraram
          find "$STAGE" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "$STAGE" -name ".DS_Store" -delete

          # Marcador pro usuário curioso
          cat > "$STAGE/README-MIRROR.md" <<'EOF'
          # Este repositório é um espelho

          O desenvolvimento do Prumo acontece em [tharso/prumo-dev](https://github.com/tharso/prumo-dev).

          Este repositório é atualizado automaticamente a cada push na main do repo de desenvolvimento. **Não abra PRs aqui** — eles serão sobrescritos no próximo espelhamento. Abra em `prumo-dev`.

          Usuários finais: este é o repo correto pra instalar o Prumo via marketplace (Cowork, Claude Code), `pip install prumo-runtime`, ou clone direto.
          EOF

          echo "Conteúdo do staging:"
          ls -la "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Push pra prumo público
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GIT_AUTHOR_NAME: "Prumo Mirror Bot"
          GIT_AUTHOR_EMAIL: "mirror@prumo.me"
          GIT_COMMITTER_NAME: "Prumo Mirror Bot"
          GIT_COMMITTER_EMAIL: "mirror@prumo.me"
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${MIRROR_TOKEN}@github.com/tharso/prumo.git"
          SHORT_SHA="${GITHUB_SHA::7}"
          WORK="$RUNNER_TEMP/mirror-work"
          rm -rf "$WORK"

          # PRESERVA HISTÓRIA (#159): clona o público existente em vez de recriá-lo
          # do zero. Assim o main público é linear/append-only e todo checkout do
          # Cowork faz fast-forward — a causa-raiz da #145 (git init + --force a cada
          # run gerava história órfã e divergência garantida) morre aqui.
          # Fallback: se o público estiver vazio/inexistente, faz o init inicial.
          if git clone -q --depth 1 "$REMOTE" "$WORK" && git -C "$WORK" rev-parse HEAD >/dev/null 2>&1; then
            echo "Público clonado; atualização incremental."
          else
            echo "Público vazio/inexistente; primeira execução (init)."
            rm -rf "$WORK"; mkdir -p "$WORK"
            git -C "$WORK" init -q -b main
            git -C "$WORK" remote add origin "$REMOTE"
          fi

          # Substitui o conteúdo pelo subset staged, PRESERVANDO o .git
          # (find em vez de rsync --delete, pra não comer os metadados do repo).
          # rm dos arquivos removidos do subset é coberto por este ciclo.
          find "$WORK" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$STAGE"/. "$WORK"/
          git -C "$WORK" add -A

          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            # Commita SÓ se o subset mudou. Sem este guard, um push no dev que só
            # toca fora do subset (tests/, dev-archive/, DECISIONS.md…) geraria um
            # `git commit` sem mudanças → falha do pipeline.
            if git -C "$WORK" rev-parse HEAD >/dev/null 2>&1 && git -C "$WORK" diff --cached --quiet; then
              echo "Sem mudança no subset distribuível — nada a espelhar."
            else
              git -C "$WORK" commit -q -m "mirror: sync from prumo-dev@${SHORT_SHA}"
              git -C "$WORK" push origin HEAD:main   # fast-forward, sem --force
              echo "main pública atualizada (linear)."
            fi
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Garante o conteúdo da release em main antes de taguear.
            if ! git -C "$WORK" rev-parse HEAD >/dev/null 2>&1 || ! git -C "$WORK" diff --cached --quiet; then
              git -C "$WORK" commit -q -m "release ${TAG} (mirrored from prumo-dev@${SHORT_SHA})"
              git -C "$WORK" push origin HEAD:main
            fi
            git -C "$WORK" tag -a "${TAG}" -m "Release ${TAG} (mirrored from prumo-dev)"
            # Tag IMUTÁVEL: sem --force. Se a tag já existe, o push falha (correto).
            git -C "$WORK" push origin "refs/tags/${TAG}"
            echo "Tag ${TAG} espelhada para prumo público."
          fi
